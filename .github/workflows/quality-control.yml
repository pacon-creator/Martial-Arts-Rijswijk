name: Website quality control

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  quality-control:
    name: Static checks and deployment baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run serious static checks
        run: npm run check

      - name: Validate HTML
        run: npm run check:html

      - name: Run Lighthouse baseline
        run: npm run check:lighthouse

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-home-report
          path: reports/lighthouse-home.json
          if-no-files-found: ignore
